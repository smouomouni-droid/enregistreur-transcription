
name: Construire APK Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dependances
        run: npm ci

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Autoriser Gradle
        run: chmod +x android/gradlew

      - name: Construire APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Recuperer le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: application-transcription
          path: android/app/build/outputs/apk/debug/app-debug.apk


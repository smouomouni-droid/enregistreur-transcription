
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enregistreur et transcription</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 15px;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(145deg, #10152e, #29236b, #5145a5);
  color: white;
}

main {
  max-width: 520px;
  margin: auto;
}

header {
  text-align: center;
  padding: 25px 10px;
}

.logo {
  font-size: 55px;
}

h1 {
  font-size: 25px;
  margin: 10px 0;
}

header p {
  color: #c9c8ee;
  font-size: 14px;
}

.panel {
  background: white;
  color: #202442;
  padding: 20px;
  border-radius: 22px;
  margin-bottom: 18px;
  box-shadow: 0 12px 30px #080b2680;
}

#status {
  background: #edf0ff;
  padding: 13px;
  border-radius: 12px;
  font-size: 14px;
  text-align: center;
  color: #444b79;
}

.mic-area {
  text-align: center;
  padding: 15px 0;
}

.mic {
  width: 105px;
  height: 105px;
  border: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, #6256e8, #3526a4);
  color: white;
  font-size: 43px;
  box-shadow: 0 8px 25px #6256e866;
}

.recording {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  50% {
    transform: scale(1.09);
    box-shadow: 0 0 0 15px #6256e822;
  }
}

button {
  cursor: pointer;
  border: 0;
  border-radius: 12px;
  padding: 15px;
  width: 100%;
  margin: 7px 0;
  font-size: 15px;
  font-weight: bold;
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.primary {
  background: #5145d8;
  color: white;
}

.stop {
  background: #e94c65;
  color: white;
}

.secondary {
  background: #edf0ff;
  color: #37358b;
}

h2 {
  font-size: 19px;
  margin-top: 0;
}

textarea {
  width: 100%;
  min-height: 190px;
  padding: 15px;
  border: 2px solid #e2e5f4;
  border-radius: 13px;
  resize: vertical;
  font-family: Arial;
  font-size: 16px;
  line-height: 1.6;
  color: #25294b;
}

.footer {
  text-align: center;
  color: #c9c8ee;
  font-size: 12px;
  padding: 12px;
}
</style>
</head>

<body>
<main>

<header>
  <div class="logo">🎙️</div>
  <h1>Enregistreur vocal</h1>
  <p>Enregistrez votre voix et transformez-la en texte</p>
</header>

<section class="panel">

  <p id="status">Prêt à enregistrer. Autorisez le microphone.</p>

  <div class="mic-area">
    <button class="mic" id="start" aria-label="Démarrer">🎙️</button>
    <p>Appuyez pour commencer</p>
  </div>

  <button class="stop" id="stop" disabled>⏹ Arrêter et transcrire</button>

  <button class="secondary" id="audio" disabled>
    🔊 Télécharger le son
  </button>

</section>

<section class="panel">
  <h2>📝 Texte transcrit</h2>

  <textarea id="result"
    placeholder="Votre texte apparaîtra ici automatiquement..."></textarea>

  <button class="primary" id="copy">
    📋 Copier le texte
  </button>

  <button class="secondary" id="downloadText" disabled>
    📥 Télécharger le texte
  </button>

  <button class="secondary" id="clear">
    🗑 Effacer le texte
  </button>
</section>

<div class="footer">
  Enregistreur et transcription • Votre assistant vocal
</div>

</main>

<script>
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const audioBtn = document.getElementById("audio");
const textBtn = document.getElementById("downloadText");
const copyBtn = document.getElementById("copy");
const clearBtn = document.getElementById("clear");
const result = document.getElementById("result");
const status = document.getElementById("status");

let recorder;
let stream;
let chunks = [];
let audioBlob = null;
let recognition = null;
let finalText = "";
let recognizing = false;

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

startBtn.onclick = async () => {
  try {
    if (!navigator.mediaDevices ||
        !window.MediaRecorder) {
      status.textContent = "Navigateur incompatible avec l'enregistrement.";
      return;
    }

    stream = await navigator.mediaDevices.getUserMedia({
      audio: true
    });

    chunks = [];
    audioBlob = null;
    finalText = "";
    result.value = "";

    audioBtn.disabled = true;
    textBtn.disabled = true;

    recorder = new MediaRecorder(stream);

    recorder.ondataavailable = event => {
      if (event.data.size > 0) {
        chunks.push(event.data);
      }
    };

    recorder.onstop = () => {
      audioBlob = new Blob(chunks, {
        type: recorder.mimeType || "audio/webm"
      });

      audioBtn.disabled = false;
      stream.getTracks().forEach(track => track.stop());
    };

    recorder.start();

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "fr-FR";
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = event => {
        let interim = "";

        for (let i = event.resultIndex;
             i < event.results.length; i++) {

          const phrase = event.results[i][0].transcript;

          if (event.results[i].isFinal) {
            finalText += phrase + " ";
          } else {
            interim += phrase;
          }
        }

        result.value = finalText + interim;
        textBtn.disabled = !result.value.trim();
      };

      recognition.onerror = event => {
        status.textContent =
          "Erreur de transcription : " + event.error;
      };

      recognition.onend = () => {
        recognizing = false;
      };

      recognition.start();
      recognizing = true;

      status.textContent = "🔴 Enregistrement et transcription en cours...";
    } else {
      status.textContent =
        "🔴 Enregistrement en cours. Transcription non disponible sur ce navigateur.";
    }

    startBtn.disabled = true;
    startBtn.classList.add("recording");
    stopBtn.disabled = false;

  } catch (error) {
    status.textContent = "Erreur : " + error.message;
  }
};

stopBtn.onclick = () => {
  if (recognition && recognizing) {
    try {
      recognition.stop();
    } catch (error) {}
  }

  if (recorder && recorder.state !== "inactive") {
    recorder.stop();
  }

  startBtn.disabled = false;
  startBtn.classList.remove("recording");
  stopBtn.disabled = true;

  textBtn.disabled = !result.value.trim();
  status.textContent = "Enregistrement arrêté.";
};

audioBtn.onclick = () => {
  if (!audioBlob) return;

  const url = URL.createObjectURL(audioBlob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "mon-enregistrement.webm";
  link.click();

  URL.revokeObjectURL(url);
};

textBtn.onclick = () => {
  const blob = new Blob([result.value], {
    type: "text/plain;charset=utf-8"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "transcription.txt";
  link.click();

  URL.revokeObjectURL(url);
};

copyBtn.onclick = async () => {
  if (!result.value.trim()) {
    status.textContent = "Aucun texte à copier.";
    return;
  }

  try {
    await navigator.clipboard.writeText(result.value);
    status.textContent = "Texte copié avec succès !";
  } catch (error) {
    result.select();
    document.execCommand("copy");
    status.textContent = "Texte copié.";
  }
};

clearBtn.onclick = () => {
  result.value = "";
  finalText = "";
  textBtn.disabled = true;
  status.textContent = "Texte effacé.";
};
</script>

</body>
</html>

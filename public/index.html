<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enregistreur et transcription</title>
<style>
body{font-family:Arial;background:#17152b;color:white;padding:20px;text-align:center}
h1{color:#c5a7ff}
button{padding:15px;margin:8px;border:0;border-radius:10px;font-size:16px;background:#7654d6;color:white}
button:disabled{opacity:.4}
textarea{width:95%;height:180px;margin-top:15px;border-radius:10px;padding:10px;font-size:16px}
#status{margin:20px;color:#b8a4ff}
</style>
</head>
<body>
<h1>Enregistreur et transcription</h1>
<p>Enregistre ta voix et transforme-la automatiquement en texte.</p>

<button id="start">🎙️ Démarrer l'enregistrement</button>
<button id="stop" disabled>⏹️ Arrêter et transcrire</button>
<p id="status">Prêt à enregistrer.</p>

<button id="audio" disabled>Télécharger le son</button>
<h3>Texte transcrit</h3>
<textarea id="result" placeholder="Le texte apparaîtra ici..."></textarea>
<br>
<button id="downloadText">Télécharger le texte</button>

<script type="module" src="./app.bundle.js"></script>
</body>
</html>
